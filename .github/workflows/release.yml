name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.0)"
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        # pty模擬(script + tmux attach)に依存する2件はCI環境で不安定なため除外
        run: go test -skip 'TestSessionsWithRealClients|TestTmuxControlBackendResizeSkippedWithRealClient' ./...

      - name: Vet
        run: go vet ./...

      - name: Ensure tag
        # 既にタグが存在すれば (手動 push 済みなど) スキップ、無ければ作成 & push。
        # これで手動タグ + workflow_dispatch の重複起動でも失敗しない。
        run: |
          TAG="v${{ inputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null; then
            echo "tag ${TAG} already exists on origin — skipping create"
          else
            git tag "${TAG}"
            git push origin "${TAG}"
          fi
          # goreleaser がタグを読めるよう local にも fetch
          git fetch --tags origin
          git checkout "${TAG}"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
